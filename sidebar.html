<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OfferGET</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sidebar-page">
  <main class="sidebar-shell">
    <header class="brand-row">
      <div class="brand-mark">OG</div>
      <div><p class="eyebrow">OFFERGET / ASSIST</p><h1>网申加速器</h1></div>
      <span class="live-dot" title="本地数据已启用"></span>
    </header>
    <section class="hero-panel">
      <div class="hero-orbit"></div>
      <p class="eyebrow light">READY TO APPLY?</p>
      <h2>把时间留给<br><em>真正重要的事。</em></h2>
      <p>从你维护的本地资料中识别并填写当前页面的常见字段。</p>
    </section>
    <section class="action-stack">
      <button class="primary-action" id="fillButton"><span class="action-icon">↗</span><span><strong>填充当前页面</strong><small>识别并写入网申字段</small></span><span class="arrow">→</span></button>
      <button class="secondary-action" id="profileButton"><span>编辑我的资料</span><span class="arrow">↗</span></button>
    </section>
    <div class="status-line" id="statusLine"><span class="status-pip"></span><span>资料已保存在本地</span></div>
    <footer><span>LOCAL-FIRST</span><span>v1.0.0</span></footer>
  </main>
  <script src="sidebar.js"></script>
</body>
</html>
